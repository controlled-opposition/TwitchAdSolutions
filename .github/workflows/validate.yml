name: Validate

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "LICENSE"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # The whole suite, with the tool versions pinned in flake.lock: formatting (treefmt), lint
      # (Biome), type check (both bundles), build up to date (vaft/vaft.user.js matches src/),
      # and tests.
      - name: Flake checks
        run: nix flake check --print-build-logs

      # Evaluates every output for every supported system without building.
      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build
