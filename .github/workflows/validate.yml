name: Validate JS

on:
  push:
    paths:
      - "**/*.js"
  pull_request:
    paths:
      - "**/*.js"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install acorn
      run: npm install -g acorn

    - name: Validate userscript
      run: acorn --ecma2022 vaft/vaft.user.js > /dev/null

    - name: Run unit tests
      run: node tests/test.js
